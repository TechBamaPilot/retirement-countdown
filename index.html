<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Retirement" />
  <title>Countdown to Retirement</title>
  <style>
    :root {
      --card-bg: rgba(15, 23, 30, 0.62);
      --card-border: rgba(255, 255, 255, 0.22);
      --accent: #f6b93b;
      --accent-glow: rgba(246, 185, 59, 0.4);
      --text-main: #ffffff;
      --text-muted: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Scenic RV background image with a subtle dark tint for readability */
      background:
        linear-gradient(rgba(10, 18, 26, 0.42), rgba(10, 18, 26, 0.58)),
        url("https://images.unsplash.com/photo-1523987355523-c7b5b0dd90a7?auto=format&fit=crop&w=2000&q=80")
        center / cover no-repeat fixed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-main);
      padding: 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 780px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 3rem 2rem;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65);
    }

    .badge {
      display: inline-block;
      padding: 0.4rem 1rem;
      border-radius: 999px;
      background: rgba(246, 185, 59, 0.2);
      border: 1px solid rgba(246, 185, 59, 0.5);
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 1.25rem;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.25rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
    }

    .subtitle {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 2.5rem;
    }

    .countdown-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-bottom: 2.5rem;
    }

    .time-box {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      padding: 1.5rem 0.75rem;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .time-box:hover {
      transform: translateY(-4px);
      border-color: rgba(246, 185, 59, 0.55);
    }

    .number {
      display: block;
      font-size: clamp(2.25rem, 6vw, 3.75rem);
      font-weight: 800;
      color: var(--accent);
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 24px var(--accent-glow);
    }

    .label {
      display: block;
      margin-top: 0.5rem;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
    }

    .progress-section {
      max-width: 560px;
      margin: 0 auto 2rem;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .progress-track {
      width: 100%;
      height: 12px;
      background: rgba(0, 0, 0, 0.45);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f6b93b, #fa983a);
      border-radius: 999px;
      transition: width 0.6s ease;
    }

    .quote {
      font-style: italic;
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 1.5rem;
    }

    .celebration {
      display: none;
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--accent);
      margin: 2rem 0;
    }

    @media (max-width: 560px) {
      .countdown-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .container {
        padding: 2rem 1.25rem;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="badge">The Open Road Awaits</div>
    <h1>Countdown to Retirement</h1>
    <p class="subtitle">Target Date: <strong>Sunday, November 21, 2027</strong></p>

    <div class="countdown-grid" id="countdown">
      <div class="time-box">
        <span class="number" id="days">000</span>
        <span class="label">Days</span>
      </div>
      <div class="time-box">
        <span class="number" id="hours">00</span>
        <span class="label">Hours</span>
      </div>
      <div class="time-box">
        <span class="number" id="minutes">00</span>
        <span class="label">Minutes</span>
      </div>
      <div class="time-box">
        <span class="number" id="seconds">00</span>
        <span class="label">Seconds</span>
      </div>
    </div>

    <div class="celebration" id="celebration">
      🚐 Happy Retirement! Time to hit the open road! 🚐
    </div>

    <div class="progress-section">
      <div class="progress-header">
        <span>Progress from Nov 19, 2026</span>
        <span id="percent-text">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <p class="quote">"Retirement is not the end of the road. It is the beginning of the open highway."</p>
  </main>

  <script>
    // Target: November 21, 2027 at 5:00 PM local time (change 17, 0, 0 to 0, 0, 0 for midnight)
    const retirementDate = new Date(2027, 10, 25, 17, 0, 0).getTime();
    // Baseline start date for the progress bar (November 19, 2026)
    const startDate = new Date(2026, 10, 19, 0, 0, 0).getTime();

    function updateCountdown() {
      const now = Date.now();
      const distance = retirementDate - now;

      if (distance <= 0) {
        document.getElementById("countdown").style.display = "none";
        document.getElementById("celebration").style.display = "block";
        document.getElementById("progress-fill").style.width = "100%";
        document.getElementById("percent-text").textContent = "100%";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById("days").textContent = String(days).padStart(2, "0");
      document.getElementById("hours").textContent = String(hours).padStart(2, "0");
      document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
      document.getElementById("seconds").textContent = String(seconds).padStart(2, "0");

      const totalDuration = retirementDate - startDate;
      const elapsed = Math.max(0, now - startDate);
      const percentage = Math.min(100, (elapsed / totalDuration) * 100);

      document.getElementById("progress-fill").style.width = percentage.toFixed(2) + "%";
      document.getElementById("percent-text").textContent = percentage.toFixed(1) + "%";
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
